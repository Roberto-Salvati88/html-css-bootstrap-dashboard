<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuovo Libro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- navbar di Bootstrap: si chiude nel menu hamburger sotto lg -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><img src="img/duck.png" alt="Logo" class="logo"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Apri il menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Catalogo Libri</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Anagrafica Utenti</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Storico Prestiti</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Help</a></li>
        </ul>
        
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="mb-4">Nuovo Libro</h1>

    <!-- form e input sono HTML: Bootstrap li stila e la griglia li dispone -->
    <form>
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label for="author-name" class="form-label">Nome Autore</label>
          <input type="text" class="form-control" id="author-name" placeholder="Inserisci il nome dell'autore">
        </div>
        <div class="col-12 col-md-6">
          <label for="author-surname" class="form-label">Cognome Autore</label>
          <input type="text" class="form-control" id="author-surname" placeholder="Inserisci il cognome dell'autore">
        </div>
        <div class="col-12">
          <label for="title" class="form-label">Titolo</label>
          <input type="text" class="form-control" id="title" placeholder="Inserisci il titolo del libro" aria-describedby="title-help">
          <div id="title-help" class="form-text">Titolo versione italiana</div>
        </div>
        <div class="col-12 col-md-4">
          <label for="genre" class="form-label">Genere</label>
          <select class="form-select" id="genre">
            <option selected>Scegli il genere</option>
            <option value="romanzo">Romanzo</option>
            <option value="fantasy">Fantasy</option>
            <option value="giallo">Giallo</option>
            <option value="classico">Classico</option>
          </select>
        </div>
        <div class="col-12 col-md-4">
          <label for="year" class="form-label">Anno di Pubblicazione</label>
          <input type="number" class="form-control" id="year" placeholder="Inserisci l'anno">
        </div>
        <div class="col-12 col-md-4">
          <label for="isbn" class="form-label">ISBN#</label>
          <input type="text" class="form-control" id="isbn" placeholder="Inserisci il codice ISBN#">
        </div>
      </div>

      <!-- la linea di separazione la faccio con un bordo, non con <hr> (feedback del tutor) -->
      <div class="border-top my-4"></div>

      <div class="mb-3">
        <label for="notes" class="form-label">Note</label>
        <textarea class="form-control" id="notes" rows="4" placeholder="Inserisci eventuali note sul libro"></textarea>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="digital">
        <label class="form-check-label" for="digital">Disponibile anche in digitale</label>
      </div>
      <button type="submit" class="btn btn-primary">Aggiungi Libro</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
